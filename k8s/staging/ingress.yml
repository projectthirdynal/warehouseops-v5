apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warehouseops-staging
  namespace: warehouseops-staging
  labels:
    app: warehouseops
    environment: staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '100M'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.warehouseops.thirdynals.org
      secretName: warehouseops-staging-tls
  rules:
    - host: staging.warehouseops.thirdynals.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warehouseops-staging
                port:
                  number: 80
