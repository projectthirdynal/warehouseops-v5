apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouseops-staging
  namespace: warehouseops-staging
  labels:
    app: warehouseops
    environment: staging
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: warehouseops
      environment: staging
  template:
    metadata:
      labels:
        app: warehouseops
        environment: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # IMAGE_PLACEHOLDER — replaced by GitHub Actions with immutable digest
          image: ghcr.io/owner/warehouseops-v5-main:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: warehouseops-staging-config
            - secretRef:
                name: warehouseops-staging-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouseops-staging-config
  namespace: warehouseops-staging
data:
  APP_ENV: staging
  APP_DEBUG: 'true'
  APP_URL: https://staging.warehouseops.thirdynals.org
  DB_CONNECTION: pgsql
  DB_HOST: postgres-staging
  DB_PORT: '5432'
  DB_DATABASE: warehouseops_staging
  REDIS_HOST: redis-staging
  REDIS_PORT: '6379'
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
