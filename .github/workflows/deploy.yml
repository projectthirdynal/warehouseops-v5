name: Deploy to Production

on:
  push:
    branches:
      - main

# Cancel any in-progress deploy if a new push arrives
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build
          # Copy the Vite build output to /opt/warehouseops/public/build/
          # (app container mounts /opt/warehouseops so no docker cp needed)
          sudo cp -rf public/build/ /opt/warehouseops/public/build/
          # Also copy into workspace so nginx container (which mounts workspace) can serve them
          # public/index.php is not in git — copy from stable /opt/warehouseops/public/
          cp -f /opt/warehouseops/public/index.php public/index.php
          cp -f /opt/warehouseops/public/robots.txt public/robots.txt 2>/dev/null || true
          cp -f /opt/warehouseops/public/favicon.ico public/favicon.ico 2>/dev/null || true
          echo 'public/ after restore:' && ls -la public/

      # Sync checked-out code + built assets to the live app directory.
      # Excludes .env (managed on server) and build artifacts managed by Docker.
      - name: Sync code to app directory
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/' \
            --exclude='public/index.php' \
            --exclude='public/favicon.ico' \
            --exclude='public/robots.txt' \
            --exclude='public/images/' \
            ./ /opt/warehouseops/

      - name: Reload build in nginx
        run: |
          # Ensure nginx workspace public/ has index.php (in case it was lost)
          cp -f /opt/warehouseops/public/index.php $GITHUB_WORKSPACE/public/index.php
          ls -la $GITHUB_WORKSPACE/public/

      - name: Install Composer dependencies
        run: |
          sudo docker exec warehouseops-app composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      - name: Run database migrations
        run: sudo docker exec warehouseops-app php artisan migrate --force

      - name: Rebuild Laravel caches
        run: |
          sudo docker exec warehouseops-app php artisan optimize:clear
          sudo docker exec warehouseops-app php artisan config:cache
          sudo docker exec warehouseops-app php artisan route:cache
          sudo docker exec warehouseops-app php artisan view:cache

      # Reload PHP-FPM gracefully — picks up php.ini changes without dropping requests.
      # Do NOT recreate the app container here: it would lose custom Docker network
      # connections (warehouseops_app) that were manually configured on this host.
      - name: Reload PHP-FPM
        run: sudo docker exec warehouseops-app kill -USR2 1 || true

      # Graceful horizon restart — terminate old worker then start fresh
      - name: Restart Horizon worker
        run: |
          sudo docker exec warehouseops-app php artisan horizon:terminate || true
          sleep 3
          sudo docker exec -d warehouseops-app php artisan horizon

      - name: Health check
        run: |
          for container in warehouseops-app warehouseops-nginx warehouseops-redis; do
            status=$(sudo docker inspect --format='{{.State.Status}}' $container 2>/dev/null)
            if [ "$status" != "running" ]; then
              echo "FAIL: $container is $status"
              exit 1
            fi
          done
          echo "All containers running."
