# ============================================
# WarehouseOps v5 — Advanced CI/CD Pipeline
# ============================================
# Pipeline: Change Detection → Validation → Unit Tests → Integration Tests
#           → Security Scan → Build → Docker Build → Container Scan
#           → Staging Deploy → Smoke Tests → Production Approval
#           → Production Deploy → Health Check → Rollback on Failure
#           → Pipeline Summary
# ============================================

name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment for deployment'
        required: false
        type: choice
        default: staging
        options:
          - staging
          - production

# ─────────────────────────────────────────────
# Global Configuration
# ─────────────────────────────────────────────
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────
jobs:
  # ============================================
  # 1. Change Detection
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "app/**"
              - "composer.json"
              - "composer.lock"
              - "database/**"
              - "routes/**"
              - "config/**"
              - "bootstrap/**"
              - "artisan"
            frontend:
              - "resources/js/**"
              - "resources/css/**"
              - "package.json"
              - "package-lock.json"
              - "vite.config.ts"
              - "tsconfig.json"
              - "tailwind.config.js"
              - "postcss.config.js"
            infra:
              - "k8s/**"
              - "infrastructure/**"
              - "docker/**"
              - "docker-compose*.yml"
            workflow:
              - ".github/workflows/**"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "docker/**"

  # ============================================
  # 2. Source Validation
  # ============================================
  validate-source:
    name: Validate Source
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── PHP Setup ──
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_pgsql, pgsql, tokenizer, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP formatting (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress
        continue-on-error: true

      # ── Frontend Setup ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check "resources/js/**/*.{ts,tsx}" || true

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # 3. Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php-version: ['8.3']
      fail-fast: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: warehouseops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d warehouseops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_pgsql, pgsql, tokenizer, xml, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=warehouseops/DB_DATABASE=warehouseops_test/' .env
          sed -i 's/DB_USERNAME=warehouseops/DB_USERNAME=test_user/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=test_password/' .env
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=array/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=array/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_DATABASE=warehouseops/DB_DATABASE=warehouseops_test/' .env.testing
          sed -i 's/DB_USERNAME=warehouseops/DB_USERNAME=test_user/' .env.testing
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=test_password/' .env.testing
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=array/' .env.testing
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env.testing
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=array/' .env.testing
          php artisan key:generate --ansi
          php artisan migrate --force

      - name: Run unit tests (Pest)
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --exclude-group=broken

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-php${{ matrix.php-version }}
          path: coverage.xml
          retention-days: 14

  # ============================================
  # 4. Integration Tests
  # ============================================
  integration-tests:
    name: Integration Tests
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: warehouseops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d warehouseops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_pgsql, pgsql, redis, tokenizer, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-integration-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare integration test environment
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=warehouseops/DB_DATABASE=warehouseops_test/' .env
          sed -i 's/DB_USERNAME=warehouseops/DB_USERNAME=test_user/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=test_password/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_DATABASE=warehouseops/DB_DATABASE=warehouseops_test/' .env.testing
          sed -i 's/DB_USERNAME=warehouseops/DB_USERNAME=test_user/' .env.testing
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=test_password/' .env.testing
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=array/' .env.testing
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env.testing
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=array/' .env.testing
          php artisan key:generate --ansi
          php artisan migrate --force

      - name: Run integration tests
        run: vendor/bin/pest --testsuite=Feature --exclude-group=broken

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            storage/logs/laravel.log
            tests/.pest/.tmp/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # 5. Static Security Scan (CodeQL)
  # ============================================
  security-scan:
    name: Security Scan
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ============================================
  # 6. Application Build
  # ============================================
  build-app:
    name: Build Application
    needs: [unit-tests, integration-tests, security-scan]
    if: always() && needs.security-scan.result == 'success' && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_pgsql, pgsql, tokenizer, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "public/build" ]; then
            echo "::error::Build output directory public/build/ does not exist"
            exit 1
          fi
          echo "Build output verified: $(find public/build -type f | wc -l) files"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: |
            public/build/
            vendor/
            app/
            config/
            database/migrations/
            routes/
            bootstrap/
            resources/views/
            composer.json
            composer.lock
            artisan
          retention-days: 14
          compression-level: 6

  # ============================================
  # 7. Docker Image Build and Publish
  # ============================================
  docker-build:
    name: Build and Publish Image
    needs: build-app
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image_name
        run: echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 8. Build Provenance Attestation
  # ============================================
  build-provenance:
    name: Build Provenance
    needs: docker-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image_name
        run: echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}
          subject-digest: ${{ needs.docker-build.outputs.image_digest }}
          push-to-registry: true

  # ============================================
  # 9. Container Security Scan (Trivy)
  # ============================================
  container-scan:
    name: Scan Container Image
    needs: docker-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image_name
        run: echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}@${{ needs.docker-build.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  # ============================================
  # 10. Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build, container-scan]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.event.inputs.target_environment == 'staging')
    runs-on: self-hosted
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.warehouseops.thirdynals.org
    concurrency:
      group: staging-deploy
      cancel-in-progress: true
    env:
      APP_DIR: /opt/warehouseops-staging
      BACKUP_DIR: /opt/warehouseops-backups/staging-$(date +%Y%m%d%H%M%S)
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $(whoami):$(whoami) $GITHUB_WORKSPACE 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Back up current staging
        run: |
          sudo mkdir -p "$BACKUP_DIR"
          if [ -d "$APP_DIR" ]; then
            sudo cp -a "$APP_DIR/app" "$BACKUP_DIR/app" 2>/dev/null || true
            sudo cp -a "$APP_DIR/database" "$BACKUP_DIR/database" 2>/dev/null || true
            sudo cp -a "$APP_DIR/resources" "$BACKUP_DIR/resources" 2>/dev/null || true
            sudo cp -a "$APP_DIR/public/build" "$BACKUP_DIR/build" 2>/dev/null || true
          fi
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Sync code to staging
        run: |
          sudo mkdir -p "$APP_DIR"
          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            ./ "$APP_DIR"/

      - name: Install dependencies & migrate
        run: |
          sudo docker run --rm -v "$APP_DIR":/var/www/html -w /var/www/html warehouseops-app:latest \
            sh -lc 'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader && php artisan optimize:clear && php artisan migrate --force && php artisan optimize'

      - name: Copy build to staging container
        run: |
          sudo docker cp "$GITHUB_WORKSPACE/public/build/" warehouseops-staging-app:/var/www/html/public/ 2>/dev/null || true

      - name: Restart staging containers
        run: |
          sudo docker restart warehouseops-staging-app 2>/dev/null || true
          sleep 3

      - name: Staging health check
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8103/login 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staging health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Staging health check passed: HTTP $HTTP_CODE"

  # ============================================
  # 11. Staging Smoke Tests
  # ============================================
  staging-smoke-tests:
    name: Staging Smoke Tests
    needs: deploy-staging
    runs-on: self-hosted
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Smoke test endpoints
        env:
          STAGING_URL: http://localhost:8103
        run: |
          ENDPOINTS=("/health" "/login" "/api/status")
          MAX_RETRIES=3
          RETRY_DELAY=5
          FAILED=0

          for endpoint in "${ENDPOINTS[@]}"; do
            URL="${STAGING_URL}${endpoint}"
            echo "Testing: $URL"
            for attempt in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
                echo "  PASS: $endpoint returned HTTP $HTTP_CODE (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                echo "  FAIL: $endpoint returned HTTP $HTTP_CODE after $MAX_RETRIES attempts"
                echo "  Response body:"
                cat /tmp/response.txt 2>/dev/null || echo "  (no response body)"
                FAILED=1
              else
                echo "  Retry $attempt/$MAX_RETRIES: HTTP $HTTP_CODE, waiting ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Staging smoke tests failed"
            exit 1
          fi
          echo "All staging smoke tests passed."

  # ============================================
  # 12. Production Approval (GitHub Environment gate)
  # ============================================
  # The production environment in GitHub requires a manual reviewer.
  # No job runs until the reviewer approves.

  # ============================================
  # 13. Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    needs: staging-smoke-tests
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.inputs.target_environment == 'production')
    runs-on: self-hosted
    timeout-minutes: 20
    environment:
      name: production
      url: https://warehouseops.thirdynals.org
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      APP_DIR: /opt/warehouseops
      BACKUP_DIR: /opt/warehouseops-backups/$(date +%Y%m%d%H%M%S)
      DEPLOYMENT_SUCCESS: 'false'
    outputs:
      BACKUP_DIR: ${{ env.BACKUP_DIR }}
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $(whoami):$(whoami) $GITHUB_WORKSPACE 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          mkdir -p public
          cp -f /opt/warehouseops/public/index.php public/index.php
          cp -f /opt/warehouseops/public/robots.txt public/robots.txt 2>/dev/null || true
          cp -f /opt/warehouseops/public/favicon.ico public/favicon.ico 2>/dev/null || true

      - name: Back up current production
        run: |
          sudo mkdir -p "$BACKUP_DIR"
          sudo cp -a "$APP_DIR/app" "$BACKUP_DIR/app"
          sudo cp -a "$APP_DIR/config" "$BACKUP_DIR/config"
          sudo cp -a "$APP_DIR/database" "$BACKUP_DIR/database"
          sudo cp -a "$APP_DIR/resources" "$BACKUP_DIR/resources"
          sudo cp -a "$APP_DIR/public/build" "$BACKUP_DIR/build"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          echo "Production backup created at: $BACKUP_DIR"

      - name: Record current rollout history
        run: |
          echo "Current Docker container state:"
          sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep warehouseops || true
          REVISION=$(sudo docker inspect --format='{{.Image}}' warehouseops-app 2>/dev/null || echo "unknown")
          echo "Current image: $REVISION"
          echo "PREVIOUS_IMAGE=$REVISION" >> "$GITHUB_ENV"

      - name: Sync code to production
        run: |
          sudo chown -R $(whoami):$(whoami) "$APP_DIR" 2>/dev/null || true
          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/' \
            --exclude='public/index.php' \
            --exclude='public/favicon.ico' \
            --exclude='public/robots.txt' \
            --exclude='public/images/' \
            ./ "$APP_DIR"/

      - name: Copy build to app container
        run: |
          sudo docker cp "$GITHUB_WORKSPACE/public/build/" warehouseops-app:/var/www/html/public/

      - name: Install Composer dependencies
        run: |
          sudo docker exec warehouseops-app composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      - name: Run database migrations
        run: sudo docker exec warehouseops-app php artisan migrate --force

      - name: Rebuild caches
        run: |
          sudo docker exec warehouseops-app php artisan optimize:clear
          sudo docker exec warehouseops-app php artisan config:cache
          sudo docker exec warehouseops-app php artisan route:cache
          sudo docker exec warehouseops-app php artisan view:cache
          sudo docker exec warehouseops-app php artisan optimize

      - name: Reload services
        run: |
          sudo docker exec warehouseops-app kill -USR2 1 || true
          sudo docker exec warehouseops-app php artisan horizon:terminate || true
          sleep 3
          sudo docker exec -d warehouseops-app php artisan horizon

      - name: Mark deployment successful
        if: success()
        run: echo "DEPLOYMENT_SUCCESS=true" >> "$GITHUB_ENV"

      - name: Production health check
        id: health_check
        continue-on-error: true
        run: |
          for container in warehouseops-app warehouseops-nginx warehouseops-redis; do
            status=$(sudo docker inspect --format='{{.State.Status}}' $container 2>/dev/null)
            if [ "$status" != "running" ]; then
              echo "::error::$container is $status"
              exit 1
            fi
          done
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8102/login)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Login page returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "All production health checks passed."

  # ============================================
  # 14. Automatic Rollback
  # ============================================
  rollback:
    name: Automatic Rollback
    needs: deploy-production
    if: failure() && needs.deploy-production.result == 'failure'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - name: Rollback production
        run: |
          BACKUP_DIR="${{ needs.deploy-production.outputs.BACKUP_DIR }}"
          APP_DIR=/opt/warehouseops

          if [ -z "$BACKUP_DIR" ] || [ ! -d "$BACKUP_DIR" ]; then
            echo "::error::No backup directory found for rollback. Manual intervention required."
            exit 1
          fi

          echo "::warning::Production deployment failed. Initiating automatic rollback..."
          echo "Rolling back from backup: $BACKUP_DIR"

          sudo rsync -a --delete "$BACKUP_DIR/app/" "$APP_DIR/app/"
          sudo rsync -a --delete "$BACKUP_DIR/config/" "$APP_DIR/config/"
          sudo rsync -a --delete "$BACKUP_DIR/database/" "$APP_DIR/database/"
          sudo rsync -a --delete "$BACKUP_DIR/resources/" "$APP_DIR/resources/"
          sudo rsync -a --delete "$BACKUP_DIR/build/" "$APP_DIR/public/build/"

          # Rebuild caches with rolled-back code
          sudo docker exec warehouseops-app php artisan optimize:clear
          sudo docker exec warehouseops-app php artisan config:cache
          sudo docker exec warehouseops-app php artisan route:cache
          sudo docker exec warehouseops-app php artisan view:cache
          sudo docker exec warehouseops-app php artisan optimize

          # Reload services
          sudo docker exec warehouseops-app kill -USR2 1 || true
          sudo docker exec warehouseops-app php artisan horizon:terminate || true
          sleep 3
          sudo docker exec -d warehouseops-app php artisan horizon

          # Verify rollback
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8102/login)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Rollback verification FAILED: HTTP $HTTP_CODE. Manual intervention required."
            exit 1
          fi

          echo "Rollback completed successfully. Production is back to previous state."
          echo "::error::Production deployment failed but rollback was successful. Original failure must be investigated."

  # ============================================
  # 15. Production Verification
  # ============================================
  verify-production:
    name: Verify Production
    needs: deploy-production
    if: success() && needs.deploy-production.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify production endpoints
        env:
          PROD_URL: http://localhost:8102
        run: |
          ENDPOINTS=("/health" "/login" "/api/status")
          MAX_RETRIES=3
          RETRY_DELAY=5
          FAILED=0

          for endpoint in "${ENDPOINTS[@]}"; do
            URL="${PROD_URL}${endpoint}"
            echo "Verifying: $URL"
            for attempt in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /tmp/prod_response.txt -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
                echo "  PASS: $endpoint returned HTTP $HTTP_CODE"
                break
              fi
              if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                echo "  FAIL: $endpoint returned HTTP $HTTP_CODE after $MAX_RETRIES attempts"
                cat /tmp/prod_response.txt 2>/dev/null || echo "  (no response body)"
                FAILED=1
              else
                echo "  Retry $attempt/$MAX_RETRIES: HTTP $HTTP_CODE, waiting ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Production verification failed"
            exit 1
          fi
          echo "All production verification checks passed."

  # ============================================
  # 16. Pipeline Summary
  # ============================================
  pipeline-summary:
    name: Pipeline Summary
    needs:
      [
        detect-changes,
        validate-source,
        unit-tests,
        integration-tests,
        security-scan,
        build-app,
        docker-build,
        container-scan,
        deploy-staging,
        staging-smoke-tests,
        deploy-production,
        verify-production,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 🚀 CI/CD Pipeline Summary

          | Stage | Status | 
          |-------|--------|
          | Change Detection | ${{ needs.detect-changes.result == 'success' && '✅ Pass' || needs.detect-changes.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Source Validation | ${{ needs.validate-source.result == 'success' && '✅ Pass' || needs.validate-source.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Pass' || needs.unit-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Pass' || needs.integration-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Security Scan (CodeQL) | ${{ needs.security-scan.result == 'success' && '✅ Pass' || needs.security-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Application Build | ${{ needs.build-app.result == 'success' && '✅ Pass' || needs.build-app.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Docker Build & Publish | ${{ needs.docker-build.result == 'success' && '✅ Pass' || needs.docker-build.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Container Security Scan | ${{ needs.container-scan.result == 'success' && '✅ Pass' || needs.container-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Staging Deployment | ${{ needs.deploy-staging.result == 'success' && '✅ Pass' || needs.deploy-staging.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Staging Smoke Tests | ${{ needs.staging-smoke-tests.result == 'success' && '✅ Pass' || needs.staging-smoke-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Production Deployment | ${{ needs.deploy-production.result == 'success' && '✅ Pass' || needs.deploy-production.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |
          | Production Verification | ${{ needs.verify-production.result == 'success' && '✅ Pass' || needs.verify-production.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |

          ---

          **Commit:** `${{ github.sha }}`  
          **Branch:** `${{ github.ref_name }}`  
          **Triggered by:** `${{ github.actor }}`  
          **Workflow:** `${{ github.workflow }}` #${{ github.run_number }}  
          **Run ID:** `${{ github.run_id }}`  

          EOF

          # Determine overall pipeline status
          FAILED_JOBS=""
          for result in "${{ needs.validate-source.result }}" "${{ needs.unit-tests.result }}" "${{ needs.integration-tests.result }}" "${{ needs.security-scan.result }}" "${{ needs.build-app.result }}"; do
            if [ "$result" == "failure" ]; then
              FAILED_JOBS="$FAILED_JOBS (validation/testing/build stage)"
            fi
          done

          if [ -n "$FAILED_JOBS" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## ⚠️ Pipeline Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed stages:$FAILED_JOBS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## ✅ Pipeline Succeeded" >> "$GITHUB_STEP_SUMMARY"
          fi
