name: WarehouseOps CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after tests pass"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: warehouseops-production
  cancel-in-progress: false

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run backend tests
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy Production
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build frontend assets on runner
        run: |
          npm ci
          npm run build

      - name: Deploy to local production path
        run: |
          set -euo pipefail

          APP_DIR=/opt/warehouseops
          BACKUP_DIR=/opt/warehouseops-backups/$(date +%Y%m%d%H%M%S)

          sudo test -d "$APP_DIR"
          sudo mkdir -p "$BACKUP_DIR"
          sudo cp -a "$APP_DIR/app" "$BACKUP_DIR/app"
          sudo cp -a "$APP_DIR/database" "$BACKUP_DIR/database"
          sudo cp -a "$APP_DIR/resources" "$BACKUP_DIR/resources"
          sudo cp -a "$APP_DIR/public/build" "$BACKUP_DIR/build"

          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            ./ "$APP_DIR"/

          cd "$APP_DIR"
          sudo docker run --rm -v "$APP_DIR":/var/www/html -w /var/www/html warehouseops-app:latest \
            sh -lc 'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader && php artisan optimize:clear && php artisan migrate --force && php artisan optimize'

          sudo chown -R www:www "$APP_DIR"
          sudo docker restart warehouseops-app warehouseops-horizon warehouseops-scheduler

      - name: Smoke check
        run: |
          set -euo pipefail
          sudo docker exec warehouseops-app sh -lc 'cd /var/www/html && php artisan route:list --path=products >/tmp/products.routes && php artisan route:list --path=inventory >/tmp/inventory.routes'
          curl -fsSIL https://warehouseops.thirdynals.org >/dev/null
