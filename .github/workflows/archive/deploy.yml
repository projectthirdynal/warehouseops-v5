name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP dependencies and run tests
        run: |
          sudo docker run --rm \
            -v "$PWD":/var/www/html \
            -w /var/www/html \
            warehouseops-app:latest \
            sh -lc 'composer install --no-interaction --prefer-dist --no-progress && cp .env.example .env && php artisan key:generate --ansi && php artisan optimize:clear && php artisan test'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Back up current app files
        run: |
          BACKUP_DIR=/opt/warehouseops-backups/$(date +%Y%m%d%H%M%S)
          sudo mkdir -p "$BACKUP_DIR"
          sudo cp -a /opt/warehouseops/app "$BACKUP_DIR/app"
          sudo cp -a /opt/warehouseops/config "$BACKUP_DIR/config"
          sudo cp -a /opt/warehouseops/database "$BACKUP_DIR/database"
          sudo cp -a /opt/warehouseops/resources "$BACKUP_DIR/resources"
          sudo cp -a /opt/warehouseops/public/build "$BACKUP_DIR/build"

      - name: Sync code to app directory
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/' \
            ./ /opt/warehouseops/

      - name: Copy build files to container
        run: |
          # Ensure build files are properly copied to the running container
          sudo docker cp public/build/ warehouseops-app:/var/www/html/public/
          # Verify manifest.json exists
          sudo docker exec warehouseops-app ls -la /var/www/html/public/build/manifest.json || echo "WARNING: manifest.json not found!"

      - name: Install Composer dependencies
        run: |
          sudo docker exec warehouseops-app composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      - name: Run database migrations
        run: sudo docker exec warehouseops-app php artisan migrate --force

      - name: Rebuild Laravel caches
        run: |
          sudo docker exec warehouseops-app php artisan optimize:clear
          sudo docker exec warehouseops-app php artisan config:cache
          sudo docker exec warehouseops-app php artisan route:cache
          sudo docker exec warehouseops-app php artisan view:cache
          sudo docker exec warehouseops-app php artisan optimize

      - name: Reload PHP-FPM
        run: sudo docker exec warehouseops-app kill -USR2 1 || true

      - name: Restart Horizon worker
        run: |
          sudo docker exec warehouseops-app php artisan horizon:terminate || true
          sleep 3
          sudo docker exec -d warehouseops-app php artisan horizon

      - name: Health check
        run: |
          for container in warehouseops-app warehouseops-nginx warehouseops-redis; do
            status=$(sudo docker inspect --format='{{.State.Status}}' $container 2>/dev/null)
            if [ "$status" != "running" ]; then
              echo "FAIL: $container is $status"
              exit 1
            fi
          done
          
          # Test application endpoints
          echo "Testing login page..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8102/login)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: Login page returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          # Test password reset routes
          echo "Testing password reset routes..."
          FORGOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8102/forgot-password)
          echo "Forgot password page: HTTP $FORGOT_CODE"
          
          sudo docker exec warehouseops-app php artisan route:list --path=products >/tmp/products.routes
          sudo docker exec warehouseops-app php artisan route:list --path=inventory >/tmp/inventory.routes
          echo "All deployment health checks passed."
