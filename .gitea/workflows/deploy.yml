name: Runner Test
"on":
  push:
    branches:
      - main
      - develop

jobs:
  test-runner:
    name: Test Runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check docker and tools
        run: |
          echo "=== docker ps ==="
          docker ps
          echo "=== which docker ==="
          which docker
          echo "=== which rsync ==="
          which rsync
          echo "=== which npm ==="
          which npm
          echo "=== which composer ==="
          which composer
          echo "=== which curl ==="
          which curl
          echo "=== whoami ==="
          whoami
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
