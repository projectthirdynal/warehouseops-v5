name: Runner Test
"on":
  push:
    branches:
      - main
      - develop

jobs:
  test-docker:
    name: Test Docker and Tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check docker socket and tools
        run: |
          echo "=== whoami ==="
          whoami
          echo "=== docker ps ==="
          docker ps
          echo "=== which docker ==="
          which docker
          echo "=== which rsync ==="
          which rsync || echo "rsync not found"
          echo "=== which npm ==="
          which npm || echo "npm not found"
          echo "=== which curl ==="
          which curl || echo "curl not found"
          echo "=== ls workspace ==="
          ls -la "$GITHUB_WORKSPACE" || ls -la .
