name: Runner Test
"on":
  push:
    branches:
      - main
      - develop

jobs:
  test-checkout:
    name: Test Checkout v3 and Install rsync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Check workspace
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== list workflow files ==="
          ls -la .gitea/workflows/ || true
          echo "=== git status ==="
          git status || true
      - name: Install rsync
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync
          echo "=== which rsync ==="
          which rsync
      - name: Check docker after checkout
        run: |
          echo "=== docker ps ==="
          docker ps
          echo "=== which npm ==="
          which npm
